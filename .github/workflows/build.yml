name: Build DeltaMusic APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v4

      - name: ZIP Dosyasini Ayikla
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -q -o *.zip
            if [ -d "deltamusic-app" ]; then
              cp -r deltamusic-app/* .
            fi
          fi

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Paketleri Yukle
        run: npm install

      - name: Android Projesini Olustur
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Delta Logolarini Yerlestir
        run: |
          python3 - << 'EOF'
          import os
          from PIL import Image

          logo_path = 'delta.png' if os.path.exists('delta.png') else 'assets/icon-only.png'
          if os.path.exists(logo_path):
              img = Image.open(logo_path).convert('RGBA')
              sizes = {
                  'mipmap-mdpi': 48,
                  'mipmap-hdpi': 72,
                  'mipmap-xhdpi': 96,
                  'mipmap-xxhdpi': 144,
                  'mipmap-xxxhdpi': 192
              }
              base_dir = 'android/app/src/main/res'
              for folder, size in sizes.items():
                  target_dir = os.path.join(base_dir, folder)
                  os.makedirs(target_dir, exist_ok=True)
                  resized = img.resize((size, size), Image.Resampling.LANCZOS)
                  resized.save(os.path.join(target_dir, 'ic_launcher.png'))
                  resized.save(os.path.join(target_dir, 'ic_launcher_round.png'))
                  resized.save(os.path.join(target_dir, 'ic_launcher_foreground.png'))
              print("Delta logolari basariyla uygulandi!")
          EOF

      - name: APK Derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: DeltaMusic-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
