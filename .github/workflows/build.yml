name: Build DeltaMusic APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v4

      - name: ZIP Dosyasini Ayikla
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -q -o *.zip
            if [ -d "deltamusic-app" ]; then
              cp -r deltamusic-app/* .
            fi
          fi

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Paketleri Yukle
        run: npm install

      - name: Android Projesini Olustur
        run: |
          npx cap add android || true
          npx cap sync android

      - name: APK Derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: DeltaMusic-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
